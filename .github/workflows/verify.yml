name: "Verify PR (Phase 1 Automated Verification)"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  verify:
    name: "Security & Test Verification"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Identify changed Python files"
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }} HEAD -- '*.py' || true)
          else
            CHANGED=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- '*.py' || true)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "1. Safety Verification — AST Security Scan"
        id: ast-scan
        run: |
          echo "### 🛡️ 1단계: 안전성 검증 (AST 보안 스캐너)" >> $GITHUB_STEP_SUMMARY
          
          CHANGED_FILES="${{ steps.changed-files.outputs.files }}"
          if [ -z "$CHANGED_FILES" ]; then
            echo "변경된 Python 파일이 없습니다. 전체 Python 파일을 스캔합니다."
            SCAN_TARGETS="src tests"
          else
            echo "검사 대상 파일:"
            echo "$CHANGED_FILES"
            SCAN_TARGETS="$CHANGED_FILES"
          fi

          set +e
          python3 src/verify/ast_scanner.py $SCAN_TARGETS --format github > scan_output.log 2>&1
          SCAN_EXIT_CODE=$?
          set -e

          cat scan_output.log

          if [ $SCAN_EXIT_CODE -eq 0 ]; then
            echo "- **결과**: 통과 ✅ (위험 시스템 호출 및 보안 취약점 미발견)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **결과**: 실패 ❌ (위험 시스템 호출 또는 보안 정책 위반 발견)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat scan_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $SCAN_EXIT_CODE
          fi

      - name: "2. Conformance Verification — Test Suite"
        id: test-suite
        if: always() && steps.ast-scan.outcome == 'success'
        run: |
          echo "### 🧪 2단계: 과제 적합성 검증 (단위 테스트)" >> $GITHUB_STEP_SUMMARY

          set +e
          python3 -m unittest discover tests > test_output.log 2>&1
          TEST_EXIT_CODE=$?
          set -e

          cat test_output.log

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "- **결과**: 통과 ✅ (모든 테스트 케이스 성공)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **결과**: 실패 ❌ (일부 테스트 케이스 불일치)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $TEST_EXIT_CODE
          fi
