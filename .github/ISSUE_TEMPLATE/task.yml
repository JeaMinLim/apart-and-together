name: "새 과제 등록"
description: "협업할 새 과제를 등록합니다. 수락 기준을 구체적으로 적어주세요 — 애매하면 검증할 방법이 없습니다."
title: "[과제] "
labels: ["task", "대기중"]
body:
  - type: textarea
    id: description
    attributes:
      label: "목표 (자유 서술)"
      description: "무엇을 만들고 싶은지 자유롭게 적어주세요."
      placeholder: "예: CSV 업로드 기능을 추가하고 싶어. 업로드된 파일을 파싱해서 DB에 저장하는 부분이 필요해."
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: "인터페이스 스펙"
      description: "함수/모듈 시그니처 등 — 명확할수록 검증이 쉬워집니다."
      placeholder: "예: parse_csv(file_path: str) -> list[dict]"
    validations:
      required: true
  - type: textarea
    id: test_cases
    attributes:
      label: "테스트 케이스"
      description: "이 과제가 통과해야 할 구체적인 입력/출력 케이스를 번호를 매겨 나열해주세요."
      placeholder: |
        1. 정상 CSV 3건 처리
        2. 빈 파일 입력 시 처리
        3. 헤더만 있는 파일 처리
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "비고 (보안/제약 사항 등)"
      placeholder: "예: DB 저장 시 SQL 인젝션 방지 필수"
  - type: dropdown
    id: assignment_mode
    attributes:
      label: "참여자 확정 방식"
      description: "선착순: 초대받은 사람 중 먼저 수락한 사람이 맡음 / 호스트 지정: 특정 인원에게 직접 요청"
      options:
        - "선착순"
        - "호스트 지정"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: "확인"
      options:
        - label: "이 과제는 초대받은 협업자에게만 공개됩니다 (불특정 다수 공개 아님)."
          required: true
